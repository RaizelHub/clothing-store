version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: studio-db
    environment:
      POSTGRES_DB: studio_db
      POSTGRES_USER: studio_user
      POSTGRES_PASSWORD: studio_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_user -d studio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studio-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: production-insecure-docker-demo-secret-key-replace-in-real-prod
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://studio_user:studio_password@db:5432/studio_db
      CORS_ALLOWED_ORIGINS: http://localhost:80,http://127.0.0.1:80,http://localhost:5173
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studio-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
